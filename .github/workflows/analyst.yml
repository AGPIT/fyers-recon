name: Senior Hunter - Analyst (fyers.in)

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: fyers.in

jobs:
  analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: analyst-fyers
      cancel-in-progress: true
    env:
      MODEL_ID: opencode/deepseek-v4-flash-free
      MODEL_NAME: deepseek

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          opencode --version

      - name: Build RAG context (bounded)
        run: |
          mkdir -p knowledge reports
          [ -f knowledge/index.md ] || echo "# Knowledge Base (seed)" > knowledge/index.md
          {
            echo "=== KNOWLEDGE BASE ==="
            cat knowledge/index.md
            echo "=== HUNTER FINDINGS (tail) ==="
            tail -n 800 findings_${MODEL_NAME}.md 2>/dev/null | awk '{ print (length($0) > 3000 ? substr($0,1,3000) "...[TRUNC]" : $0) }' | tail -c 40000 || echo none
            echo "=== RESEARCH (tail) ==="
            tail -n 1500 research_${MODEL_NAME}.md 2>/dev/null | awk '{ print (length($0) > 3000 ? substr($0,1,3000) "...[TRUNC]" : $0) }' | tail -c 80000 || echo none
            echo "=== MY PREVIOUS ANALYST RUNS (tail) ==="
            tail -n 120 analyst_${MODEL_NAME}.md 2>/dev/null || echo none
            echo "=== NEW-HOST INVENTORY ==="
            cat surface-map-new-hosts.md 2>/dev/null | tail -c 10000 || echo none
            echo "=== SMARTHUNT REPORT ==="
            tail -c 12000 smarthunt-results/*REPORT* 2>/dev/null || echo none
            echo "=== STATE ==="
            cat state_${MODEL_NAME}.json 2>/dev/null || echo none
          } > ctx.txt
          wc -c ctx.txt

      - name: Analyst run (8-step methodology)
        run: |
          cat > analyst-prompt.txt << 'PROMPT_START'
          You are a senior bug bounty ANALYST for target ${TARGET} (and *.${TARGET} only). Your job is NOT to invent vulnerabilities. The hunter bots below produced raw findings/research; you turn that into ranked, verified-first hypotheses. Run these 8 steps and output ONLY the structured blocks.

          STEP 1 — DELTA: Compare the knowledge base + new-host inventory + previous analyst runs + hunter findings. List only NEW or CHANGED surface items as [NEW]/[CHANGED] (one line each). If nothing is new, state "NO_DELTA".

          STEP 2 — PRIORITIZE: Score the top new assets (or top existing if no delta) on 6 axes 0-10: attack_surface, business_value, tech_exposure (GraphQL/OAuth/JWT/upload/admin/uncommon stacks), gate_ease (10 = no auth needed), cloud_surface, freshness. priority = 0.25*attack + 0.25*business + 0.15*tech + 0.15*gate + 0.10*cloud + 0.10*fresh. Emit [PRIO] lines: asset, score, axis breakdown.

          STEP 3 — HYPOTHESES: For the top 3 prioritized assets emit max 1 hypothesis each, strictly this schema:
          [HYP] <title>
          class: <IDOR|SSRF|AUTH|XSS|BUSLOGIC|MISCONFIG|OATH|OTHER>
          asset: <host/endpoint>
          confidence: <0-100>
          reasoning: <facts only from the provided context, 2-3 lines>
          evidence_needed: <what proves it>
          verify_steps: <passive-first concrete HTTP requests, or AUTH_HELPED:...>
          impact: <what attacker gets + severity>
          testability: <PASSIVE|AUTH_HELPED|HUMAN_ONLY>

          STEP 4 — SELF-CRITIQUE: Drop any hypothesis that: confidence < 40, or class on the knowledge REJECTED list, or no concrete verify_steps, or depends on a third-party host (scope is ${TARGET} only). For dropped ones emit [PARKED] <title>: <why dropped>. Emit [FINAL] with survivors re-ranked.

          STEP 5 — NEXT ACTION: Choose exactly one and emit [NEXT] <PROBE|SCAN|RAG|HUMAN>: <one concrete action with exact endpoint/request if PROBE>.

          STEP 6 — LEARNING: Emit [LEARN] lines for any class newly proven dead or alive (format: REJECTED/ACCEPTED <class> @ <asset>: <reason>).

          STEP 7 — RISK SCORE: Emit [RISK] fyers: <0-100> reason (overall exposure, not exploit status).

          RULES: facts vs hypotheses strictly separated; no endpoint-map-only output; never mention secrets in full (hash with sha256sum); all claims must trace to the context below or read-only probes of ${TARGET}; never report best-practice/absence-of-header/info-disclosure noise.
          PROMPT_START
          cat ctx.txt >> analyst-prompt.txt
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          timeout 18m opencode run --model "$MODEL_ID" < analyst-prompt.txt > analyst-out.txt 2>&1 || true
          grep -E '^\[(NEW|CHANGED|PRIO|HYP|PARKED|FINAL|NEXT|LEARN|RISK)\]|^class:|^confidence:|^asset:|^impact:|^testability:|^verify_steps:|^reasoning:|^evidence_needed:' analyst-out.txt > lead.txt || true
          {
            echo ""
            echo "===== ANALYST $(date -u +'%Y-%m-%d %H:%M:%S UTC') ====="
            cat lead.txt
          } >> analyst_${MODEL_NAME}.md
          {
            echo "===== RAW ANALYST $(date -u +'%Y-%m-%d %H:%M:%S UTC') ====="
            cat analyst-out.txt
          } >> analyst-raw_${MODEL_NAME}.log
          echo "=== lead preview ==="; head -40 lead.txt

      - name: Append learnings to knowledge base + state update
        run: |
          python3 << 'PY_EOF'
          import re, os, datetime
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          kpath = 'knowledge/index.md'
          ktext = open(kpath).read()
          added = 0
          try:
              out = open('analyst-out.txt', errors='ignore').read()
          except Exception:
              out = ''
          with open(kpath, 'a') as k:
              for m in re.finditer(r'^\[LEARN\]\s*(REJECTED|ACCEPTED)\s+(\S+)\s+@\s+(\S+):\s*(.*)$', out, re.M):
                  line = f"- {stamp[:10]} {m.group(1)} {m.group(2)} @ {m.group(3)}: {m.group(4).strip()[:160]}"
                  if line not in ktext:
                      k.write(line + '\n')
                      added += 1
          # state phase advance
          st = {}
          try:
              import json
              st = json.load(open(f'state_{os.environ["MODEL_NAME"]}.json'))
          except Exception:
              pass
          phases = ['RECON', 'SURFACE', 'HYPOTHESIS', 'POC']
          if st.get('phase') in phases:
              st['phase'] = phases[min(phases.index(st['phase']) + 1, 3)]
          import json
          json.dump(st, open(f'state_{os.environ["MODEL_NAME"]}.json', 'w'))
          print(f'knowledge: {added} learnings appended | state phase: {st.get("phase")}')
          PY_EOF
          mkdir -p reports
          cp lead.txt reports/analyst-latest.txt

      - name: Commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add analyst_${MODEL_NAME}.md analyst-raw_${MODEL_NAME}.log knowledge state_${MODEL_NAME}.json reports || true
          git diff --cached --quiet || git commit -m "analyst ${TARGET} $(date -u +'%Y-%m-%d-%H-%M')"
          git pull --rebase || true
          git push || true
